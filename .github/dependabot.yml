# The Kanon entry lane-check requires of adopters (K-ADOPT-11). Its pattern also covers the
# sandbox's own S0 probe caller (yedeya-labs/kanon-sandbox).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: daily
    allow:
      - dependency-name: "yedeya-labs/kanon*"
    cooldown:
      default-days: 3
      exclude: ["yedeya-labs/kanon*"]
    commit-message:
      prefix: ci
      include: scope
    groups:
      kanon:
        patterns: ["yedeya-labs/kanon*"]

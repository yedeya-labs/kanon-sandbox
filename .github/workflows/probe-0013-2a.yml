# plan 0013 S0 item 2 (kanon#1166): workflow a of two whose jobs share one queue: max group.
name: probe-0013-2a
on:
  # push only registers the workflow so it can be dispatched from this branch; every job skips on push.
  push:
    branches: [probe/plan-0013-s0]
  workflow_dispatch:
    inputs:
      hold: { type: string, required: false, default: '20' }
permissions: {}
jobs:
  slot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: probe-0013-g2
      cancel-in-progress: false
      queue: max
    steps:
      - run: |
          echo "workflow a run ${{ github.run_id }} holds the slot for ${{ inputs.hold }}s"
          sleep ${{ inputs.hold }}

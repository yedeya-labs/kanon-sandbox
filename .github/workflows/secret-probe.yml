# Secret probe: does a called workflow's environment job read an environment secret?
# A: undeclared. B: declared, caller maps none. C: declared, caller maps its own (repo) value.
name: Secret probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  a:
    uses: ./.github/workflows/secret-callee-a.yml
  b:
    uses: ./.github/workflows/secret-callee-b.yml
  c:
    uses: ./.github/workflows/secret-callee-b.yml
    secrets:
      KANON_DEPLOY_SECRET: ${{ secrets.KANON_DEPLOY_SECRET }}

name: probe-0013-3a
on:
  workflow_dispatch:
  # push only registers the workflow so it can be dispatched from this branch; every job skips on push.
  push:
    branches: [probe/plan-0013-s0]
permissions: {}
jobs:
  slot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: probe-0013-3
    concurrency:
      group: probe-0013-g3
      cancel-in-progress: false
      queue: max
    steps:
      - run: echo "approved; never expected to run in the probe"

# Secret probe: the callee declares KANON_DEPLOY_SECRET optional; its job sets environment:.
name: Secret callee B
on:
  workflow_call:
    secrets:
      KANON_DEPLOY_SECRET:
        required: false
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    environment: secret-probe
    steps:
      - env:
          KANON_DEPLOY_SECRET: ${{ secrets.KANON_DEPLOY_SECRET }}
        run: echo "B declared length=${#KANON_DEPLOY_SECRET} prefix=${KANON_DEPLOY_SECRET:0:3}"

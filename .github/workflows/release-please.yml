# Kanon's reusable release workflow, pinned to the release the other callers pin. It maps the
# Releaser's two secrets by name (docs/release.md): with them stored, a release it publishes
# starts the deploy lane (plan 0010 §3); without them it runs on the workflow token, whose
# release starts no run.
name: Release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release:
    name: Release
    permissions:
      contents: write
      pull-requests: write
    uses: yedeya-labs/kanon/.github/workflows/release.yml@candidate-v0.41.0
    secrets:
      RELEASER_APP_ID: ${{ secrets.RELEASER_APP_ID }}
      RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

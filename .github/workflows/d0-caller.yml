# D0 probe (plan 0010 §14.2): a throwaway caller of two throwaway called workflows.
name: D0 caller
on:
  workflow_dispatch:
  release:
    types: [published]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Print the OIDC token's claims outside any environment (never the token)
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"]; p=t.split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("CLAIMS "+json.dumps({k:c.get(k) for k in ["sub","aud","environment","ref","ref_type","job_workflow_ref","workflow_ref","actor","event_name"]}))'
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/d0-build.yml
  staging:
    needs: build
    permissions:
      id-token: write
    uses: ./.github/workflows/d0-env.yml
    with:
      environment: probe-staging
      digest: ${{ needs.build.outputs.digest }}
  production:
    needs: [build, staging]
    permissions:
      id-token: write
    uses: ./.github/workflows/d0-env.yml
    with:
      environment: probe-production
      digest: ${{ needs.build.outputs.digest }}
  none:
    needs: build
    permissions:
      id-token: write
    uses: ./.github/workflows/d0-env.yml
    with:
      environment: ''
      digest: ${{ needs.build.outputs.digest }}

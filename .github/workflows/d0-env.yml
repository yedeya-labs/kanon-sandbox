# D0 probe (plan 0010): a called workflow whose one job takes its environment from an input.
name: D0 env
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: ''
      digest:
        type: string
        required: true
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: d0-env-${{ inputs.environment || 'none' }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: d0-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art
      - name: Check the build's digest
        run: |
          got=$(sha256sum "$RUNNER_TEMP/art/build.txt" | cut -d' ' -f1)
          echo "expected=${{ inputs.digest }} got=$got"
          test "$got" = "${{ inputs.digest }}"
      - name: Print the OIDC token's claims (never the token)
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"]; p=t.split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print("CLAIMS "+json.dumps({k:c.get(k) for k in ["sub","aud","environment","ref","ref_type","job_workflow_ref","workflow_ref","repository","repository_id","repository_owner_id","actor","event_name"]}))'
          echo "INPUT environment='${{ inputs.environment }}'"

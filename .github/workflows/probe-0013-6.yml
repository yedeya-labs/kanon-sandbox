# plan 0013 S0 item 6 (kanon#1166): an environment job with deployment: false. Prints the OIDC claims, never the token.
name: probe-0013-6
on:
  # push only registers the workflow so it can be dispatched from this branch; every job skips on push.
  push:
    branches: [probe/plan-0013-s0]
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: probe-0013-6
      deployment: false
    steps:
      - name: claims
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, environment, ref, job_workflow_ref}' || true

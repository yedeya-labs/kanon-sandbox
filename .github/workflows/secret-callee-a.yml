# Secret probe (kanon deploy-secret bug): the callee declares no secret; its job sets environment:.
name: Secret callee A
on:
  workflow_call:
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    environment: secret-probe
    steps:
      - env:
          KANON_DEPLOY_SECRET: ${{ secrets.KANON_DEPLOY_SECRET }}
        run: echo "A undeclared length=${#KANON_DEPLOY_SECRET}"

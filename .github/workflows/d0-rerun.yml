# D0 follow-up probe (plan 0010 D5): can attempt 2 of a "Re-run failed jobs" download attempt 1's artifact by name?
name: D0 rerun
on:
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.n.outputs.name }}
    steps:
      - id: n
        run: |
          echo "attempt ${GITHUB_RUN_ATTEMPT}" > a.txt
          echo "name=d0-rerun-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.n.outputs.name }}
          path: a.txt
          retention-days: 1
  use:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}
      - run: |
          echo "this attempt=${GITHUB_RUN_ATTEMPT} downloaded: $(cat a.txt) name=${{ needs.build.outputs.name }}"
          test "$GITHUB_RUN_ATTEMPT" != "1"

# D0 probe (plan 0010): a called workflow that builds one artifact for the environments.
name: D0 build
on:
  workflow_call:
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/art"
          echo "built at ${GITHUB_SHA} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/art/build.txt"
          echo "digest=$(sha256sum "$RUNNER_TEMP/art/build.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: d0-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/art/
          retention-days: 1

# S0 probe: the "Kanon" side, a reusable workflow adopters pin by tag.
name: Reusable
on:
  workflow_call:
permissions: {}
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      # The ref reaches the script through env, never inline: a branch name may hold `$(...)`.
      - env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: echo "reusable (1.1.0) at $WORKFLOW_REF"

# The deploy lane's build hook (docs/lanes.md, "The deploy lane"), filled for plan 0010's D12
# rehearsal with a trivial step and no cloud.
name: Deploy lane build hook
description: "Builds what every environment deploys, from the checked-out commit, into the output directory. It runs with no credential and no secret."
inputs:
  output:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  sha:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - name: Write dist/hello.txt holding the release tag
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        test -n "$RELEASE" && test -n "$OUTPUT"
        mkdir -p "$OUTPUT/dist"
        printf '%s\n' "$RELEASE" > "$OUTPUT/dist/hello.txt"
        echo "Built $OUTPUT/dist/hello.txt for $RELEASE"

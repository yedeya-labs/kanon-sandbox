# The deploy lane's deploy hook (docs/lanes.md, "The deploy lane"), filled for plan 0010's D12
# rehearsal with a trivial step and no cloud.
name: Deploy lane deploy hook
description: "Obtains the environment's cloud credential and deploys the artifact directory; with probe 'true', only tries to obtain each listed environment's credential and writes refused, obtained or unconfigured for each to $RUNNER_TEMP/kanon-deploy-probe.json."
inputs:
  artifact:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  environment:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  environments:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  probe:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  role:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  sha:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    # The probe: there is no cloud, so no credential can be obtained; every declared
    # environment answers `refused`.
    - name: Answer the trust probe
      if: inputs.probe == 'true'
      shell: bash
      env:
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail
        node -e '
          const names = process.env.ENVIRONMENTS.split(/[\s,]+/).filter(Boolean);
          const answers = Object.fromEntries(names.map((n) => [n, "refused"]));
          require("fs").writeFileSync(process.env.RUNNER_TEMP + "/kanon-deploy-probe.json", JSON.stringify(answers));
          console.log("probe answers", JSON.stringify(answers));
        '
    - name: Check the artifact holds dist/hello.txt with the release tag
      if: inputs.probe != 'true'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        RELEASE: ${{ inputs.release }}
        ENVIRONMENT: ${{ inputs.environment }}
        ROLE: ${{ inputs.role }}
      run: |
        set -euo pipefail
        f="$ARTIFACT/dist/hello.txt"
        test -f "$f" || { echo "::error::$f is missing"; exit 1; }
        got="$(cat "$f")"
        [ "$got" = "$RELEASE" ] || { echo "::error::$f holds '$got', expected '$RELEASE'"; exit 1; }
        echo "Deployed $RELEASE to $ENVIRONMENT ($ROLE)"

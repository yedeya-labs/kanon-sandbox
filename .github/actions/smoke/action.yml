# The deploy lane's smoke hook (docs/lanes.md, "The deploy lane"), filled for plan 0010's D12
# rehearsal with a trivial step and no cloud.
name: Deploy lane smoke hook
description: "Checks the deployed system answers as the release expects."
inputs:
  environment:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  release:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
  role:
    description: Passed by Kanon's deploy lane (docs/lanes.md).
    default: ""
runs:
  using: composite
  steps:
    - name: Smoke, failing on a run's first attempt only, so a re-run of failed jobs passes
      shell: bash
      env:
        ATTEMPT: ${{ github.run_attempt }}
        RELEASE: ${{ inputs.release }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        if [ "$ATTEMPT" = "1" ]; then
          echo "::error::the rehearsal's smoke check fails on attempt 1 for $ENVIRONMENT at $RELEASE"
          exit 1
        fi
        echo "Smoke passed for $ENVIRONMENT at $RELEASE"
